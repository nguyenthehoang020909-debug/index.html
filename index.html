<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; color: white; text-align: center; padding: 20px; }
        .card { background: linear-gradient(135deg, #2c3e50, #000000); border-radius: 20px; padding: 30px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); margin-bottom: 20px; border: 1px solid #34495e; }
        h2 { margin: 0; font-size: 1.2rem; color: #bdc3c7; }
        .balance { font-size: 2.5rem; font-weight: bold; margin: 15px 0; color: #2ecc71; }
        .user-id { font-size: 0.8rem; color: #7f8c8d; }
        .btn { background: #3498db; border: none; padding: 15px 30px; color: white; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; transition: 0.3s; }
        .btn:active { transform: scale(0.98); background: #2980b9; }
    </style>
</head>
<body>
    <div class="card">
        <h2>SỐ DƯ KHẢ DỤNG</h2>
        <div class="balance" id="balance">0 VND</div>
        <div class="user-id" id="user-id">Đang tải...</div>
    </div>
    
    <button class="btn" onclick="transfer()">💸 CHUYỂN TIỀN NHANH</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Mở rộng app hết cỡ
        
        // Hiển thị thông tin người dùng từ Telegram
        document.getElementById('user-id').innerText = "ID: " + tg.initDataUnsafe.user.id;
        
        // Giả lập lấy số dư từ Server (Sau này ông kết nối với Backend Python)
        document.getElementById('balance').innerText = "5,000,000 VND";

        function transfer() {
            tg.showAlert("Tính năng chuyển tiền đang được bảo trì!");
        }
    </script>
</body>
</html>
